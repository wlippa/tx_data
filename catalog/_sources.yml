# _sources.yml
#
# Registry of HPC source locations for each canonical table. Build scripts
# read from here rather than hardcoding paths, so a build can be re-pointed
# (e.g. from Tx842 to a future Tx900) by editing this one file.
#
# Path resolution:
#   Effective source path = <TX_DATA_SOURCE_ROOT || config/paths.yml source_root> + relative_path
#   For local development, the mocked equivalent lives in nemo_mock/<relative_path>.
#
# Filenames starting with `_` are treated as registry/metadata by catalog.load_all()
# and are not loaded as table definitions.

cohort:
  id: Tx842
  human_name: TRACERx 842
  source_root_default: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842
  # Optional per-table source_root overrides for assets that live outside the
  # main release tree — resolves to `source_root: <root>` on the table entry.

alt_source_roots:
  cn_ccf_alphamissense: /nemo/project/proj-tracerx-lung/tctProjects/CN-CCF/alphamissense

sources:
  muttable:
    relative_path: tx842_mutation_table.tsv.gz
    format: tsv_gz
    header: true
    received: 2026-08-31
    notes: |
      Long format, one row per (mutation, sample) pair. Filter by is_present==True
      for "actually detected in this sample".

  wgd_calls:
    relative_path: WGD/release_tx842/WGD_calls.tsv
    format: tsv
    header: true
    received: 2026-08-31
    notes: |
      Per-clone WGD assignments AND the tumour tree in one file — satisfies
      both the "PGDD output" and "phylogenetic tree" requirements.
      Uses tumour_id spelling `LTX0001-Tumour1` (differs from muttable's
      `LTX0001_tumour1`); loader normalises.

  alphamissense:
    source_root: cn_ccf_alphamissense                  # from alt_source_roots
    relative_path_pattern: "output/annotated_muttables/tx842/{tumour_id}_muttable_alpha.tsv"
    format: tsv                                        # plain TSV, no `##` comment lines, clean header row
    header: true
    per_tumour: true
    per_tumour_layout: flat                            # files sit directly under tx842/ (no per-tumour subdirectory)
    tumour_id_form: "LTX0001_tumour1"                  # underscore + lowercase; matches muttable, NOT wgd_calls canonical form
    received: 2026-08-31
    notes: |
      One file per tumour. Muttable-shaped TSV with the AlphaMissense
      columns appended (NOT raw VEP output). The loader reads only:
        chr, pos, var, alpha_missense, am_class
      and dedupes to per-(tumour × chr × pos × alt) because the file is
      long-form (one row per mutation × sample).

      Real column semantics:
        alpha_missense  — float score in [0, 1]; NA for non-missense.
        am_class        — {benign, ambiguous, pathogenic}; NA for non-missense.

      Layout changed 2026-09-02 (confirmed by Odysseus): files were moved
      into an `output/` subdirectory, the per-tumour subdirectory was
      flattened, tumour_id spelling in the filename switched from
      `LTX0001-Tumour1` to `LTX0001_tumour1`, the `_muttable_annotated`
      suffix became `_muttable_alpha`. Extension `.tsv`, plain tab-separated,
      clean header row (no `##` comments, no leading `#`). File shape
      changed from raw VEP → muttable + AM: `Location` / `Allele` /
      `Consequence` / `Gene` columns no longer exist; the AM score column
      is `alpha_missense`, renamed to `am_pathogenicity` at build time.

  clinical:
    relative_path: tx842_clinical.tsv
    format: tsv
    header: true
    null_marker: "NA"
    received: 2026-08-31
    notes: |
      Per-patient. Multi-tumour patients encode two lesions on one row
      (histology1_ / histology2_); loader unpivots to per-tumour view.
      Does NOT contain purity, ploidy, TP53 status, mutation signatures, or
      survival time-to-event columns — those live elsewhere (TBC) or must
      be derived.

  driver_list:
    relative_path: drivers/tx842_driver_gene_list.tsv
    format: tsv
    header: true
    null_marker: "NA"
    received: 2026-09-01
    notes: |
      TRACERx-bespoke driver gene list. Recommended filter for SNV analyses
      is `lung_mut_driver == TRUE`. Contains both hg19 and hg38 coordinates
      (GENCODE v49). Replaces the earlier plan to use COSMIC CGC directly.
